<form id="entryForm">

  <input
    type="date"
    id="date"
    required
  >

  <input
    type="text"
    id="project"
    placeholder="Project"
    required
  >

  <input
    type="number"
    id="hours"
    placeholder="Hours"
    required
  >

  <button type="submit">
    Create Entry
  </button>

</form>
