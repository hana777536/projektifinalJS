<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Entry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<form id="entryForm">

    <input type="date" id="date" required>

    <input
        type="text"
        id="project"
        placeholder="Project"
        required
    >

    <input
        type="number"
        id="hours"
        placeholder="Hours"
        required
    >

    <button type="submit">
        Create Entry
    </button>

</form>

<script src="js/create.js"></script>

</body>
</html>
