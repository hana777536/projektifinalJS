<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Entry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<form id="entryForm">

    <input
        type="date"
        id="date"
        required
    >

    <input
        type="text"
        id="project"
        placeholder="Project"
        required
    >

    <input
        type="number"
        id="hours"
        placeholder="Hours"
        required
    >

    <button type="submit">
        Update Entry
    </button>

</form>

<script src="js/edit.js"></script>

</body>
</html>
